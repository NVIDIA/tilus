<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <!-- Global -> Shared -> Register -> Tensor Core -> Global -->

  <!-- Global memory (A, B) -->
  <rect x="20" y="55" width="110" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="75" y="80" text-anchor="middle" font-weight="700" font-size="12" fill="#1b5e20">Global</text>
  <text x="75" y="98" text-anchor="middle" font-size="11" fill="#2e7d32">A, B tiles</text>

  <!-- Shared memory -->
  <rect x="185" y="55" width="110" height="60" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="240" y="80" text-anchor="middle" font-weight="700" font-size="12" fill="#bf360c">Shared</text>
  <text x="240" y="98" text-anchor="middle" font-size="11" fill="#e65100">sa, sb</text>

  <!-- Registers -->
  <rect x="350" y="55" width="110" height="60" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="405" y="80" text-anchor="middle" font-weight="700" font-size="12" fill="#0d47a1">Registers</text>
  <text x="405" y="98" text-anchor="middle" font-size="11" fill="#1565c0">a, b, acc</text>

  <!-- Tensor core -->
  <rect x="515" y="55" width="110" height="60" rx="5" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="570" y="80" text-anchor="middle" font-weight="700" font-size="12" fill="#5e35b1">Tensor Core</text>
  <text x="570" y="98" text-anchor="middle" font-size="11" fill="#7e57c2">mma.sync</text>

  <!-- Global out -->
  <rect x="670" y="55" width="70" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="705" y="80" text-anchor="middle" font-weight="700" font-size="12" fill="#1b5e20">Global</text>
  <text x="705" y="98" text-anchor="middle" font-size="11" fill="#2e7d32">C</text>

  <!-- Arrows -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="132" y1="85" x2="181" y2="85" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="156" y="45" text-anchor="middle" font-size="10.5" fill="#666">tma.</text>
  <text x="156" y="57" text-anchor="middle" font-size="10.5" fill="#666">global_to_shared</text>

  <line x1="297" y1="85" x2="346" y2="85" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="321" y="45" text-anchor="middle" font-size="10.5" fill="#666">load_</text>
  <text x="321" y="57" text-anchor="middle" font-size="10.5" fill="#666">shared</text>

  <line x1="462" y1="75" x2="511" y2="75" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="511" y1="98" x2="462" y2="98" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="487" y="45" text-anchor="middle" font-size="10.5" fill="#666">dot</text>
  <text x="487" y="57" text-anchor="middle" font-size="10.5" fill="#666">(acc)</text>

  <line x1="627" y1="85" x2="666" y2="85" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="646" y="51" text-anchor="middle" font-size="10.5" fill="#666">store_global</text>

  <!-- Highlight the register round trip -->
  <rect x="340" y="40" width="295" height="90" rx="6" fill="none" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="487" y="150" text-anchor="middle" font-size="11.5" fill="#c62828" font-weight="700">operands round-trip through the register file</text>
  <text x="487" y="167" text-anchor="middle" font-size="10.5" fill="#c62828">V1 removes this: WGMMA reads shared memory directly</text>
</svg>
