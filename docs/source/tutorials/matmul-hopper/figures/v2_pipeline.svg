<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <!-- ============ V1: serial ============ -->
  <text x="380" y="22" text-anchor="middle" font-weight="700" font-size="15" fill="#333">V1: single stage — load and compute are serial</text>

  <text x="52" y="62" text-anchor="end" font-size="11" fill="#666">TMA</text>
  <text x="52" y="92" text-anchor="end" font-size="11" fill="#666">WGMMA</text>

  <rect x="60" y="45" width="90" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="105" y="61" text-anchor="middle" font-size="10" fill="#bf360c">Load k=0</text>
  <rect x="150" y="75" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="185" y="91" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=0</text>

  <rect x="220" y="45" width="90" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="265" y="61" text-anchor="middle" font-size="10" fill="#bf360c">Load k=1</text>
  <rect x="310" y="75" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="345" y="91" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=1</text>

  <rect x="380" y="45" width="90" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="425" y="61" text-anchor="middle" font-size="10" fill="#bf360c">Load k=2</text>
  <rect x="470" y="75" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="505" y="91" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=2</text>

  <line x1="60" y1="112" x2="540" y2="112" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="80" font-size="11" fill="#c62828">each engine idle</text>
  <text x="600" y="96" font-size="11" fill="#c62828">half the time</text>

  <!-- ============ V2: pipelined ============ -->
  <line x1="40" y1="150" x2="720" y2="150" stroke="#ddd" stroke-width="1"/>
  <text x="380" y="182" text-anchor="middle" font-weight="700" font-size="15" fill="#333">V2: multi-stage ring buffer — loads run ahead of compute</text>

  <text x="52" y="222" text-anchor="end" font-size="11" fill="#666">TMA</text>
  <text x="52" y="252" text-anchor="end" font-size="11" fill="#666">WGMMA</text>

  <!-- prefill -->
  <rect x="60" y="205" width="70" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="95" y="221" text-anchor="middle" font-size="10" fill="#bf360c">Load k=0</text>
  <rect x="130" y="205" width="70" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="165" y="221" text-anchor="middle" font-size="10" fill="#bf360c">Load k=1</text>
  <rect x="200" y="205" width="70" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="235" y="221" text-anchor="middle" font-size="10" fill="#bf360c">Load k=2</text>
  <rect x="270" y="205" width="70" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="305" y="221" text-anchor="middle" font-size="10" fill="#bf360c">Load k=3</text>
  <rect x="340" y="205" width="70" height="24" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="375" y="221" text-anchor="middle" font-size="10" fill="#bf360c">Load k=4</text>

  <!-- compute lags by S -->
  <rect x="130" y="235" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="165" y="251" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=0</text>
  <rect x="200" y="235" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="235" y="251" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=1</text>
  <rect x="270" y="235" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="305" y="251" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=2</text>
  <rect x="340" y="235" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="375" y="251" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=3</text>
  <rect x="410" y="235" width="70" height="24" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="445" y="251" text-anchor="middle" font-size="10" fill="#5e35b1">MMA k=4</text>

  <line x1="60" y1="272" x2="540" y2="272" stroke="#ccc" stroke-width="1"/>
  <text x="300" y="290" text-anchor="middle" font-size="10.5" fill="#666">time</text>

  <!-- prefill bracket -->
  <path d="M 60 199 L 60 192 L 130 192 L 130 199" fill="none" stroke="#999" stroke-width="1"/>
  <text x="95" y="187" text-anchor="middle" font-size="10" fill="#666">prefill</text>

  <text x="600" y="240" font-size="11" fill="#2e7d32">both engines busy</text>

  <text x="380" y="322" text-anchor="middle" font-size="11.5" fill="#666">In V2 the two rows still belong to the <tspan font-weight="700">same</tspan> 128 threads, separated by</text>
  <text x="380" y="338" text-anchor="middle" font-size="11.5" fill="#666">block-wide syncs — V3 gives each row its own warps.</text>
</svg>
