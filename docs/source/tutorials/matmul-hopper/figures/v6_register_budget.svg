<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="r6hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#ffebee"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ef9a9a" stroke-width="2.5"/>
    </pattern>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="15" fill="#333">Registers per thread, 2 consumer warp groups + 1 producer warp group</text>
  <text x="380" y="43" text-anchor="middle" font-size="11.5" fill="#666">Each consumer holds a 64 x 320 fp32 accumulator: 160 registers per thread before anything else.</text>

  <!-- scale: 0..256 registers over x = 230..710 (1.875 px per register) -->
  <text x="545" y="62" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c62828">160 = accumulator alone</text>
  <line x1="530" y1="68" x2="530" y2="258" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- ROW 1: uniform split, consumer side -->
  <text x="222" y="90" text-anchor="end" font-size="12" font-weight="700" fill="#c62828">Uniform, consumer</text>
  <text x="222" y="105" text-anchor="end" font-size="10" fill="#c62828">168 regs/thread</text>
  <rect x="230" y="76" width="315" height="34" fill="url(#r6hatch)" stroke="#c62828" stroke-width="1.6"/>
  <text x="387" y="97" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b71c1c">168: accumulator + 8 — spills 3.2 KB</text>

  <!-- ROW 2: uniform split, producer side -->
  <text x="222" y="146" text-anchor="end" font-size="12" font-weight="700" fill="#333">Uniform, producer</text>
  <text x="222" y="161" text-anchor="end" font-size="10" fill="#777">168 regs/thread</text>
  <rect x="230" y="132" width="315" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <rect x="230" y="132" width="75" height="34" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="267" y="153" text-anchor="middle" font-size="10.5" fill="#5e35b1">used</text>
  <text x="425" y="153" text-anchor="middle" font-size="10.5" fill="#999">idle — only issues TMA</text>
  <text x="230" y="184" font-size="10.5" fill="#666">384 threads x 168 = 64,512 registers, nearly the whole 65,536-entry file.</text>

  <!-- ROW 3: after setmaxnreg -->
  <text x="222" y="232" text-anchor="end" font-size="12" font-weight="700" fill="#333">V6 — setmaxnreg</text>
  <text x="222" y="247" text-anchor="end" font-size="10" fill="#777">232 / 40 regs/thread</text>
  <rect x="230" y="218" width="435" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="380" y="239" text-anchor="middle" font-size="10.5" fill="#1b5e20">consumer: 232</text>
  <rect x="675" y="218" width="75" height="34" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="712" y="239" text-anchor="middle" font-size="10.5" fill="#5e35b1">producer: 40</text>

  <line x1="60" y1="278" x2="700" y2="278" stroke="#eee" stroke-width="1"/>
  <text x="60" y="298" font-size="11" fill="#333"><tspan font-weight="700">256 x 232 + 128 x 40 = 64,512</tspan> — the same total as the uniform split.</text>
  <text x="60" y="315" font-size="11" fill="#333">The producer releases what it never used, and the consumers' accumulators fit without spilling.</text>
</svg>
