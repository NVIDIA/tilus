<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-weight="700" font-size="15" fill="#333">256 x 256 tile across four consumer warp groups</text>

  <!-- A slabs -->
  <text x="98" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#333">A (shared)</text>
  <rect x="55" y="70" width="86" height="42" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="98" y="96" text-anchor="middle" font-size="10" fill="#0d47a1">sa[stage, 0]</text>
  <rect x="55" y="112" width="86" height="42" fill="#e1f5fe" stroke="#0277bd" stroke-width="1.3"/>
  <text x="98" y="138" text-anchor="middle" font-size="10" fill="#01579b">sa[stage, 1]</text>
  <rect x="55" y="154" width="86" height="42" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="98" y="180" text-anchor="middle" font-size="10" fill="#0d47a1">sa[stage, 2]</text>
  <rect x="55" y="196" width="86" height="42" fill="#e1f5fe" stroke="#0277bd" stroke-width="1.3"/>
  <text x="98" y="222" text-anchor="middle" font-size="10" fill="#01579b">sa[stage, 3]</text>
  <text x="98" y="256" text-anchor="middle" font-size="10" fill="#666">4 x (64 x 64)</text>

  <!-- B tile -->
  <text x="238" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#333">B (shared)</text>
  <rect x="178" y="70" width="120" height="168" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
  <text x="238" y="148" text-anchor="middle" font-size="11" fill="#bf360c">sb[stage]</text>
  <text x="238" y="166" text-anchor="middle" font-size="10" fill="#e65100">256 x 64</text>
  <text x="238" y="256" text-anchor="middle" font-size="10" fill="#666">read by all four</text>

  <!-- C tile quarters -->
  <text x="470" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#333">C tile (fp16 accumulators, in registers)</text>
  <rect x="340" y="70" width="260" height="42" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="470" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">WG0 — rows 0-63</text>
  <text x="470" y="105" text-anchor="middle" font-size="9.5" fill="#7e57c2">64 x 256 fp16 = 64 regs/thread</text>
  <rect x="340" y="112" width="260" height="42" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="470" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">WG1 — rows 64-127</text>
  <rect x="340" y="154" width="260" height="42" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="470" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">WG2 — rows 128-191</text>
  <rect x="340" y="196" width="260" height="42" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="470" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">WG3 — rows 192-255</text>

  <line x1="300" y1="91" x2="336" y2="91" stroke="#777" stroke-width="1.1" marker-end="url(#a6)"/>
  <line x1="300" y1="133" x2="336" y2="133" stroke="#777" stroke-width="1.1" marker-end="url(#a6)"/>
  <line x1="300" y1="175" x2="336" y2="175" stroke="#777" stroke-width="1.1" marker-end="url(#a6)"/>
  <line x1="300" y1="217" x2="336" y2="217" stroke="#777" stroke-width="1.1" marker-end="url(#a6)"/>

  <!-- Epilogue -->
  <line x1="40" y1="285" x2="720" y2="285" stroke="#ddd" stroke-width="1"/>
  <text x="380" y="311" text-anchor="middle" font-weight="700" font-size="13.5" fill="#333">Epilogue: four quarters take turns through one shared buffer</text>

  <rect x="120" y="325" width="72" height="34" rx="4" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="156" y="346" text-anchor="middle" font-size="10" fill="#5e35b1">WG0..WG3</text>

  <rect x="290" y="325" width="110" height="34" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.4"/>
  <text x="345" y="341" text-anchor="middle" font-size="10.5" fill="#bf360c">sc [64, 256]</text>
  <text x="345" y="354" text-anchor="middle" font-size="9.5" fill="#e65100">one quarter at a time</text>

  <rect x="500" y="325" width="120" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="560" y="341" text-anchor="middle" font-size="10.5" fill="#1b5e20">Global C</text>
  <text x="560" y="354" text-anchor="middle" font-size="9.5" fill="#2e7d32">bulk TMA store</text>

  <line x1="194" y1="342" x2="286" y2="342" stroke="#777" stroke-width="1.2" marker-end="url(#a6)"/>
  <text x="240" y="335" text-anchor="middle" font-size="9.5" fill="#666">store_shared</text>
  <line x1="402" y1="342" x2="496" y2="342" stroke="#777" stroke-width="1.2" marker-end="url(#a6)"/>
  <text x="449" y="335" text-anchor="middle" font-size="9.5" fill="#666">producer warp</text>

  <text x="660" y="346" font-size="10" fill="#666">epilogue_ready /</text>
  <text x="660" y="358" font-size="10" fill="#666">epilogue_free</text>
</svg>
